name: navii_flutter
description: >-
  Deterministic mascot-style avatar widget for Flutter.
  Drop-in avatar generation — same seed = same mascot, every time.
  No database, no uploads, no state required.
version: 0.2.1
repository: https://github.com/Sankwan/navii_flutter/tree/main/packages/navii_flutter
homepage: https://github.com/Sankwan/navii_flutter
issue_tracker: https://github.com/Sankwan/navii_flutter/issues
funding:
  - https://github.com/sponsors/Sankwan

topics:
  - avatar
  - deterministic
  - mascot
  - offline
  - profile-picture

screenshots:
  - description: 'Chat list — each user gets a unique mascot avatar automatically'
    path: screenshots/chat.png
  - description: 'Avatar picker — let users choose from variants of their seed'
    path: screenshots/picker.png
  - description: 'Shapes, status indicators, borders, and group avatars'
    path: screenshots/customize.png
  - description: 'Sizes from 24px to 128px and all 22 built-in palettes'
    path: screenshots/customize_2.png

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.0
  navii_dart: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
